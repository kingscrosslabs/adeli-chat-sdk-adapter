name: Publish

# Push a tag vX.Y.Z whose version matches package.json. The package is
# checked, built and published to npm with provenance through npm trusted
# publishing (OIDC), so no npm token is stored in the repository.
on:
  push:
    tags: ['v*']

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Check and publish to npm
    # npm's trusted publisher is bound to this workflow file and environment name.
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Require the tag to match package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}."
            exit 1
          fi
          if npm view "@adeli/chat-sdk-adapter@${version}" version >/dev/null 2>&1; then
            echo "::error::@adeli/chat-sdk-adapter@${version} is already on npm."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
      - run: npm publish --access public --provenance
