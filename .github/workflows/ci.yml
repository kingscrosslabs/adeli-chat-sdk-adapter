name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  adapter:
    name: Adapter checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Check the tarball holds only dist, package.json, README.md and LICENSE
        run: |
          set -euo pipefail
          npm pack --dry-run --json > pack.json
          node -e '
            const [pkg] = require("./pack.json");
            const allowed = (p) => p.startsWith("dist/") || ["package.json", "README.md", "LICENSE"].includes(p);
            const extra = pkg.files.map((f) => f.path).filter((p) => !allowed(p));
            if (extra.length) { console.error("Unexpected files in tarball:", extra); process.exit(1); }
            console.log(pkg.files.map((f) => f.path).join("\n"));
          '
